[project]
name = "lk-unlock"
version = "1.1.0"
description = "Unlock Xiaomi MTK bootloader by patching the LK image (cert bypass)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [
    { name = "georgiynesterov" },
    { name = "tayuLuc" },
]
keywords = ["xiaomi", "mtk", "bootloader", "unlock", "lk"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Boot",
]

dependencies = [
    "cryptography>=42.0",
    "pyasn1>=0.6",
    "liblk",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lk-unlock = "lk_unlock.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.0",
    "pyusb>=1.3.1",
    "ruff>=0.6",
]

[tool.uv.sources]
# liblk is not on PyPI and upstream only ships it via git. Vendored under
# vendor/liblk/ (GPL-3.0, compatible with this project's AGPL-3.0) for fully
# offline, reproducible builds. See THIRD_PARTY.md for provenance.
liblk = { path = "vendor/liblk" }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lk_unlock"]

[tool.hatch.build.targets.sdist]
include = ["src/lk_unlock", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
