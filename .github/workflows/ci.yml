name: ci

on:
  push:
    branches: [main, uv-migration]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --dev --frozen
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Test
        run: uv run pytest tests/ -v

  build:
    needs: lint-test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: lk-unlock-linux
          - os: macos-latest
            artifact: lk-unlock-macos
          - os: windows-latest
            artifact: lk-unlock-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Install PyInstaller
        run: uv run --no-sync pip install pyinstaller
      - name: Build binary
        run: uv run pyinstaller --onefile --name lk-unlock src/lk_unlock/cli.py
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/lk-unlock*
      - name: Compute hashes
        shell: bash
        run: |
          cd dist
          sha256sum lk-unlock* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-checksums
          path: dist/SHA256SUMS

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts/
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          generate_release_notes: true
